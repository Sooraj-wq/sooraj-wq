name: Refresh contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - scripts/contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/contributions.py
      - name: Save graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh contribution graph"
          git pull --rebase -X theirs
          git push
